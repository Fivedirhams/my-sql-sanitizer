# =============================================================================
# CloakDB — Docker Compose Configuration
# =============================================================================
#
# Quick Start:
#   1. cp .env.example .env  && vim .env  # Укажи LLM_API_KEY (+ провайдер/модель)
#   2. docker compose up --build           # Build & run wizard
#   3. Select dump → review config → run!
#
# Batch Mode (no wizard):
#   docker compose run --rm cloakdb --batch examples/chinook_test.sql \
#                                  -o /app/output/sanitized.sql
#
# Development (hot-reload config):
#   docker compose up                         # Rebuilds on first run
# =============================================================================

services:
  cloakdb:
    build:
      context: .
      dockerfile: Dockerfile.cloakdb
    image: cloakdb:latest

    # Interactive wizard by default — or use --batch for CI
    stdin_open: true
    tty: true

    volumes:
      - ./config.yaml:/app/config.yaml:ro       # Config (read-only)
      - ./output:/app/output                    # Output directory
      - ./examples:/app/examples:ro             # Example dumps
      # Свой дамп: положить файл в examples/ и запустить с --batch examples/<файл>.
      # Отдельный монтир `/input/dump.sql` был удалён: файла в репозитории нет, а
      # docker при отсутствующем источнике молча создаёт КАТАЛОГ на его месте —
      # и --batch получает папку вместо дампа.

    environment:
      # LLM — настраивается ЦЕЛИКОМ через .env: provider / model / endpoint / token.
      # Пустые LLM_ENDPOINT и LLM_MODEL => берутся пресеты провайдера (см. config.py).
      - LLM_PROVIDER=${LLM_PROVIDER:-ofox}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_MAX_COMPLETION_TOKENS=${LLM_MAX_COMPLETION_TOKENS:-32768}
      - LLM_TIMEOUT_BASE=${LLM_TIMEOUT_BASE:-45}
      - LLM_TIMEOUT_MAX=${LLM_TIMEOUT_MAX:-180}
      - SAMPLES_PER_FIELD=${SAMPLES_PER_FIELD:-50}
      - PROFILES_DIR=${PROFILES_DIR:-output/profiles}
      # UTF-8 locale so the interactive wizard reads Cyrillic without crashing
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PYTHONUTF8=1
      - PYTHONIOENCODING=utf-8

    # Resource constraints
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    restart: "no"  # CLI tool — stops after completion
